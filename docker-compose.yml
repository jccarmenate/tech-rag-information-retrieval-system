services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - backend-data:/app/data
    environment:
      - DATABASE_URL=sqlite:///./data/coderadar.db
      - CHROMA_PERSIST_DIR=data/chroma
      # Leave ANTHROPIC_API_KEY unset to use the local Ollama service below,
      # or set it (and LLM_PROVIDER=anthropic) to use Claude instead.
      - OLLAMA_BASE_URL=http://ollama:11434
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
    depends_on:
      - ollama

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama-models:/root/.ollama

volumes:
  backend-data:
  ollama-models:
